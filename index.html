<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teikas Ezīša Karaoke</title>
<style>
body {
    font-family: Arial, sans-serif;
    margin:0;
    background:#121212;
    color:white;
}
.login {
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}
.card {
    background:#1e1e1e;
    padding:30px;
    border-radius:16px;
    width:320px;
    box-shadow:0 0 20px rgba(0,0,0,.4);
}
input {
    width:100%;
    padding:12px;
    margin:8px 0;
    border-radius:8px;
    border:none;
    box-sizing:border-box;
}

button {
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#ff9800;
    cursor:pointer;
    font-weight:bold;
}
#app {
    display:none;
    max-width:1200px;
    margin:auto;
    padding:20px;
}
#search {
    font-size:22px;
    padding:16px;
}

.song {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 12px;
    border-bottom: 1px solid #333;
}

.fav-btn {
    width: auto;
    padding: 5px 10px;
    background: transparent;
    color: #aaa;
    font-size: 22px;
    border: none;
    cursor: pointer;
}

.fav-btn.active {
    color: #ffb300;
}
.counter {
    margin:15px 0;
    color:#ccc;
}
</style>
</head>
<body>

<div id="loginPage" class="login">
  <div class="card">
    <h2>Autorizācija</h2>
    <input id="user" placeholder="Lietotājvārds">
    <input id="pass" type="password" placeholder="Parole">
    <button onclick="login()">Ieiet</button>
    <p id="msg"></p>
  </div>
</div>

<div id="app">
    <h1>🎤 Teikas Ezīša Karaoke</h1>
    <input id="search" placeholder="Meklēt dziesmu..." oninput="filterSongs()">
    <button id="favoritesToggle" onclick="toggleFavoritesView()">
    ⭐ Mani favorīti
</button>
    <div class="counter" id="counter"></div>
    <div id="songs"></div>
</div>

<script>
const USERNAME = "karaoke";
const PASSWORD = "migla"; // ---------------------------------------------------vari mainīt šeit

    //-------------lashishana no csv faila
let songs = [];

async function loadSongs() {
    const response = await fetch("songs.csv?v=" + Date.now());
    const text = await response.text();

    songs = text
        .split(/\r?\n/)
        .map(line => line.trim())
        .filter(line => line.length > 0);
}
    
function login() {
    if (
        document.getElementById('user').value === USERNAME &&
        document.getElementById('pass').value === PASSWORD
    ) {
        document.getElementById('loginPage').style.display='none';
        document.getElementById('app').style.display='block';
        //----------te notiek visa fiich
        loadSongs().then(() => {
            renderSongs(songs);
        });
        
    } else {
        document.getElementById('msg').textContent = 'Tu nemāki rakstīt :(';
        //document.getElementById('msg').textContent = 'Nepareizs lietotājvārds vai parole!';
    }
}


let favorites = new Set(
    JSON.parse(localStorage.getItem("teikasKaraokeFavorites") || "[]")
);

let showingFavorites = false;

function escapeHtml(value) {
    return value.replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

function saveFavorites() {
    localStorage.setItem(
        "teikasKaraokeFavorites",
        JSON.stringify([...favorites])
    );
}

function renderSongs(list) {
    const container = document.getElementById("songs");

    container.innerHTML = list.map(song => {
        const safeSong = escapeHtml(song);
        const active = favorites.has(song);

        return `
            <div class="song">
                <span>${safeSong}</span>
                <button
                    class="fav-btn ${active ? "active" : ""}"
                    data-song="${safeSong}"
                    onclick="toggleFavorite(this)"
                    aria-label="Pievienot vai noņemt favorītu"
                    title="Pievienot vai noņemt favorītu"
                >${active ? "★" : "☆"}</button>
            </div>
        `;
    }).join("");

    document.getElementById("counter").textContent =
        "Atrastas " + list.length + " dziesmas";
}

function toggleFavorite(button) {
    const song = button.dataset.song;

    if (favorites.has(song)) {
        favorites.delete(song);
    } else {
        favorites.add(song);
    }

    saveFavorites();
    filterSongs();
}

function toggleFavoritesView() {
    showingFavorites = !showingFavorites;

    document.getElementById("favoritesToggle").textContent =
        showingFavorites ? "🎵 Visas dziesmas" : "⭐ Mani favorīti";

    filterSongs();
}

function filterSongs() {
    const normalize = text =>
        text
            .normalize("NFC")
            .toLocaleLowerCase("lv")
            .trim()
            .replace(/\s+/g, " ");

    const q = normalize(document.getElementById("search").value);

    const source = showingFavorites
        ? songs.filter(song => favorites.has(song))
        : songs;

    const filtered = source.filter(song =>
        normalize(song).includes(q)
    );

    renderSongs(filtered);
}

</script>

</body>
</html>
